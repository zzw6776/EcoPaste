name: Release CI

"on":
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release-metadata:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.release.outputs.prerelease }}
      release_id: ${{ steps.release.outputs.release_id }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate release notes
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+([+-][0-9A-Za-z.-]+)?$/.test(version)) throw new Error('Invalid release version');
          const path = `docs/releases/${version}.md`;
          const [title, ...body] = readFileSync(path, 'utf8').replace(/\r\n/g, '\n').split('\n');
          if (title !== `# ${version}`) throw new Error(`${path}: first line must be # ${version}`);
          if (!body.some(line => /^[-*]\s+\S/.test(line) && /\p{Script=Han}/u.test(line))) {
            throw new Error(`${path}: at least one nonempty Chinese change entry is required`);
          }
          console.log(`Validated ${path}`);
          NODE

      - name: Validate version and create draft release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail

          target_sha="${GITHUB_SHA}"
          version="$(node -p "require('./package.json').version")"
          notes_file="docs/releases/${version}.md"
          previous_version="$(git show "${target_sha}^:package.json" 2>/dev/null | node -e "let input=''; process.stdin.on('data', chunk => input += chunk); process.stdin.on('end', () => console.log(JSON.parse(input).version));" || true)"
          cargo_version="$(sed -n '/^\[package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)"
          lock_version="$(awk '
            /^name = "EcoPaste"$/ { package_found = 1; next }
            package_found && /^version = "/ {
              value = $0
              sub(/^version = "/, "", value)
              sub(/"$/, "", value)
              print value
              exit
            }
          ' src-tauri/Cargo.lock)"

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::package.json version must be valid semver, got '${version}'."
            exit 1
          fi
          if [[ -n "${previous_version}" && "${version}" == "${previous_version}" ]]; then
            echo "::error::Every master commit must bump the project version; both commits use '${version}'."
            exit 1
          fi
          if [[ "${cargo_version}" != "${version}" || "${lock_version}" != "${version}" ]]; then
            echo "::error::Version mismatch: package.json=${version}, Cargo.toml=${cargo_version}, Cargo.lock=${lock_version}."
            exit 1
          fi

          git fetch --force --tags
          tag_name="v${version}"
          existing_tag_sha="$(git rev-list -n 1 "${tag_name}" 2>/dev/null || true)"

          if [[ -n "${existing_tag_sha}" && "${existing_tag_sha}" != "${target_sha}" ]]; then
            echo "::error::Tag '${tag_name}' already points to ${existing_tag_sha}; bump the project version."
            exit 1
          fi

          if [[ -z "${existing_tag_sha}" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "${tag_name}" "${target_sha}" --message "Release ${tag_name}"
            git push origin "refs/tags/${tag_name}"
          fi

          prerelease=false
          if [[ "${version}" == *-* ]]; then
            prerelease=true
          fi

          if gh release view "${tag_name}" >/dev/null 2>&1; then
            is_draft="$(gh release view "${tag_name}" --json isDraft --jq .isDraft)"
            if [[ "${is_draft}" != "true" ]]; then
              echo "::error::Release '${tag_name}' is already published. Bump the project version for a new commit."
              exit 1
            fi
            gh release edit "${tag_name}" --notes-file "${notes_file}"
          else
            release_args=(
              "${tag_name}"
              --draft
              --notes-file "${notes_file}"
              --target "${target_sha}"
              --title "${tag_name}"
              --verify-tag
            )
            if [[ "${prerelease}" == "true" ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "${release_args[@]}"
          fi

          release_id="$(gh release view "${tag_name}" --json databaseId --jq .databaseId)"
          {
            echo "prerelease=${prerelease}"
            echo "release_id=${release_id}"
            echo "tag_name=${tag_name}"
            echo "version=${version}"
          } >> "${GITHUB_OUTPUT}"

  build-desktop:
    name: Build ${{ matrix.label }}
    needs: release-metadata
    permissions:
      actions: read
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Intel
            os: macos-26-intel
            publish_release: true
            target: x86_64-apple-darwin
          - label: Windows x64
            os: windows-latest
            publish_release: true
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-metadata.outputs.tag_name }}

      - name: Check updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not configured."
            exit 1
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Tauri icons
        run: pnpm icons:check

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-${{ matrix.target }}
          workspaces: src-tauri

      - name: Trust macOS release signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: bash scripts/trustMacosReleaseCertificate.sh

      - name: Build desktop app
        uses: tauri-apps/tauri-action@v1
        env:
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.MACOS_SIGNING_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: "${{ runner.os == 'macOS' && 'Mac Development: EcoPaste Self-Signed' || '' }}"
          CI: false
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          PLATFORM: ${{ matrix.os }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json
          prerelease: ${{ needs.release-metadata.outputs.prerelease }}
          releaseDraft: true
          releaseId: ${{ matrix.publish_release && needs.release-metadata.outputs.release_id || '' }}
          retryAttempts: 3
          tagName: ${{ matrix.publish_release && needs.release-metadata.outputs.tag_name || '' }}
          uploadUpdaterJson: false

      - name: Verify macOS app signatures and DMG contents before publishing
        if: runner.os == 'macOS'
        shell: bash
        env:
          TAURI_TARGET: ${{ matrix.target }}
        run: bash scripts/verifyMacosBundle.sh "src-tauri/target/${TAURI_TARGET}/release/bundle"

  start-macos-apple-candidates:
    name: Start macOS Apple Silicon candidates
    needs: release-metadata
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    outputs:
      run_id: ${{ steps.candidates.outputs.run_id }}
    steps:
      - name: Start parallel candidate builds
        id: candidates
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAG_NAME: ${{ needs.release-metadata.outputs.tag_name }}
        run: |
          set -euo pipefail

          title="macOS Apple Silicon ${TAG_NAME}"
          gh workflow run macos-apple-candidates.yml \
            --ref "${TAG_NAME}" \
            -f "tag_name=${TAG_NAME}"

          deadline=$((SECONDS + 120))
          while (( SECONDS < deadline )); do
            run_id="$(
              gh run list \
                --workflow macos-apple-candidates.yml \
                --event workflow_dispatch \
                --limit 20 \
                --json databaseId,displayTitle \
                | jq -r --arg title "${title}" \
                    '.[] | select(.displayTitle == $title) | .databaseId' \
                | head -n 1
            )"
            if [[ -n "${run_id}" ]]; then
              echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            sleep 2
          done

          echo '::error::The Apple Silicon candidate workflow did not start.'
          exit 1

  upload-macos-apple:
    name: Upload macOS Apple Silicon
    needs:
      - release-metadata
      - build-desktop
      - start-macos-apple-candidates
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Download first successful Apple Silicon candidate
        id: candidate
        shell: bash
        env:
          CANDIDATE_RUN_ID: ${{ needs.start-macos-apple-candidates.outputs.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          deadline=$((SECONDS + 3600))
          artifact_id=''
          artifact_name=''
          while (( SECONDS < deadline )); do
            artifacts="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}/artifacts?per_page=100"
            )"
            native_id="$(
              jq -r '.artifacts[] | select(.expired == false and .name == "macos-aarch64-native") | .id' \
                <<< "${artifacts}" \
                | head -n 1
            )"
            cross_id="$(
              jq -r '.artifacts[] | select(.expired == false and .name == "macos-aarch64-cross") | .id' \
                <<< "${artifacts}" \
                | head -n 1
            )"
            if [[ -n "${native_id}" ]]; then
              artifact_id="${native_id}"
              artifact_name='macos-aarch64-native'
              break
            fi
            if [[ -n "${cross_id}" ]]; then
              artifact_id="${cross_id}"
              artifact_name='macos-aarch64-cross'
              break
            fi

            run_status="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}" \
                --jq '.status'
            )"
            if [[ "${run_status}" == "completed" ]]; then
              echo '::error::Neither Apple Silicon build route produced a complete candidate.'
              exit 1
            fi
            sleep 10
          done

          if [[ -z "${artifact_id}" ]]; then
            echo '::error::No Apple Silicon candidate completed within 60 minutes.'
            exit 1
          fi

          destination="${RUNNER_TEMP}/macos-aarch64"
          mkdir -p "${destination}"
          gh run download "${CANDIDATE_RUN_ID}" \
            --name "${artifact_name}" \
            --dir "${destination}"
          echo "Selected ${artifact_name}."

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}/cancel" \
            >/dev/null 2>&1 || true

      - name: Upload successful candidate
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
          TAG_NAME: ${{ needs.release-metadata.outputs.tag_name }}
        run: |
          set -euo pipefail

          selected="${RUNNER_TEMP}/macos-aarch64"

          source_assets=(
            "${selected}/dmg/EcoPaste_${RELEASE_VERSION}_aarch64.dmg"
            "${selected}/macos/EcoPaste.app.tar.gz"
            "${selected}/macos/EcoPaste.app.tar.gz.sig"
          )
          for asset in "${source_assets[@]}"; do
            if [[ ! -f "${asset}" ]]; then
              echo "::error::Missing Apple Silicon release asset: ${asset}"
              exit 1
            fi
          done

          release_assets="${RUNNER_TEMP}/macos-aarch64-release"
          mkdir -p "${release_assets}"
          cp "${source_assets[1]}" "${release_assets}/EcoPaste_${RELEASE_VERSION}_aarch64.app.tar.gz"
          cp "${source_assets[2]}" "${release_assets}/EcoPaste_${RELEASE_VERSION}_aarch64.app.tar.gz.sig"
          assets=(
            "${source_assets[0]}"
            "${release_assets}/EcoPaste_${RELEASE_VERSION}_aarch64.app.tar.gz"
            "${release_assets}/EcoPaste_${RELEASE_VERSION}_aarch64.app.tar.gz.sig"
          )
          gh release upload "${TAG_NAME}" "${assets[@]}" --clobber

  build-android:
    name: Build Android ${{ matrix.label }}
    needs: release-metadata
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ARM64
            rust_target: aarch64-linux-android
            tauri_target: aarch64
          - label: ARMv7
            rust_target: armv7-linux-androideabi
            tauri_target: armv7
          - label: x86
            rust_target: i686-linux-android
            tauri_target: i686
          - label: x86_64
            rust_target: x86_64-linux-android
            tauri_target: x86_64
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-metadata.outputs.tag_name }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.rust_target }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          link-to-sdk: true
          ndk-version: r29

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Android signing properties
        env:
          SIGNING_ZIP_PASSWORD: ${{ secrets.SIGNING_PROPERTIES_ZIP_PASSWORD }}
        run: |
          if [ -z "$SIGNING_ZIP_PASSWORD" ]; then
            echo "SIGNING_PROPERTIES_ZIP_PASSWORD is not configured." >&2
            exit 1
          fi

          unzip -P "$SIGNING_ZIP_PASSWORD" -o signing.properties.zip signing.properties
          printf '\nkeystore.file=release.keystore\n' >> signing.properties
          chmod 600 signing.properties
          test -s signing.properties
          test -s release.keystore

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-${{ matrix.tauri_target }}
          workspaces: src-tauri

      - name: Build and upload Android app
        uses: tauri-apps/tauri-action@v1
        env:
          CI: false
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        with:
          args: --apk --split-per-abi --target ${{ matrix.tauri_target }} --config src-tauri/tauri.release.conf.json
          mobile: android
          prerelease: ${{ needs.release-metadata.outputs.prerelease }}
          releaseDraft: true
          releaseId: ${{ needs.release-metadata.outputs.release_id }}
          retryAttempts: 3
          tagName: ${{ needs.release-metadata.outputs.tag_name }}

  publish-release:
    name: Publish Release
    needs:
      - release-metadata
      - upload-macos-apple
      - build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-metadata.outputs.tag_name }}

      - name: Create updater manifest
        shell: bash
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.release-metadata.outputs.release_id }}
          TAG_NAME: ${{ needs.release-metadata.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
          UPDATER_MANIFEST_PATH: ${{ runner.temp }}/ecopaste-updater/latest.json
        run: |
          set -euo pipefail
          node scripts/createUpdaterManifest.mjs
          gh release upload "${TAG_NAME}" "${UPDATER_MANIFEST_PATH}#latest.json" --clobber

      - name: Publish completed release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.release-metadata.outputs.prerelease }}
          TAG_NAME: ${{ needs.release-metadata.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          set -euo pipefail

          args=("${TAG_NAME}" --draft=false --notes-file "docs/releases/${RELEASE_VERSION}.md")
          if [[ "${PRERELEASE}" == "true" ]]; then
            args+=(--prerelease)
          else
            args+=(--prerelease=false)
          fi
          gh release edit "${args[@]}"

  cleanup-caches:
    name: Clean Superseded Cargo Caches
    needs: publish-release
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Keep release caches within target limits
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_prefixes=(
            v0-rust-desktop-aarch64-apple-darwin-
            v0-rust-desktop-x86_64-apple-darwin-
            v0-rust-android-aarch64-
            v0-rust-android-armv7-
            v0-rust-android-i686-
            v0-rust-android-x86_64-
          )
          windows_prefix="v0-rust-desktop-x86_64-pc-windows-msvc-"
          legacy_prefixes=(
            v0-rust-build-desktop-Darwin-arm64-
            v0-rust-build-desktop-Windows_NT-x64-
          )

          for prefix in "${current_prefixes[@]}"; do
            gh cache list \
              --repo "${GITHUB_REPOSITORY}" \
              --key "${prefix}" \
              --sort created_at \
              --order desc \
              --limit 100 \
              --json id \
              --jq '.[1:] | .[].id' |
              while IFS= read -r cache_id; do
                gh cache delete "${cache_id}" --repo "${GITHUB_REPOSITORY}"
              done
          done

          gh cache list \
            --repo "${GITHUB_REPOSITORY}" \
            --key "${windows_prefix}" \
            --sort created_at \
            --order desc \
            --limit 100 \
            --json id \
            --jq '.[2:] | .[].id' |
            while IFS= read -r cache_id; do
              gh cache delete "${cache_id}" --repo "${GITHUB_REPOSITORY}"
            done

          for prefix in "${legacy_prefixes[@]}"; do
            gh cache list \
              --repo "${GITHUB_REPOSITORY}" \
              --key "${prefix}" \
              --limit 100 \
              --json id \
              --jq '.[].id' |
              while IFS= read -r cache_id; do
                gh cache delete "${cache_id}" --repo "${GITHUB_REPOSITORY}"
              done
          done
