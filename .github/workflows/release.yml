name: Release CI

"on":
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release-metadata:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.release.outputs.prerelease }}
      release_id: ${{ steps.release.outputs.release_id }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate version and create draft release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail

          target_sha="${GITHUB_SHA}"
          version="$(node -p "require('./package.json').version")"
          previous_version="$(git show "${target_sha}^:package.json" 2>/dev/null | node -e "let input=''; process.stdin.on('data', chunk => input += chunk); process.stdin.on('end', () => console.log(JSON.parse(input).version));" || true)"
          cargo_version="$(sed -n '/^\[package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)"
          lock_version="$(awk '
            /^name = "EcoPaste"$/ { package_found = 1; next }
            package_found && /^version = "/ {
              value = $0
              sub(/^version = "/, "", value)
              sub(/"$/, "", value)
              print value
              exit
            }
          ' src-tauri/Cargo.lock)"

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::package.json version must be valid semver, got '${version}'."
            exit 1
          fi
          if [[ -n "${previous_version}" && "${version}" == "${previous_version}" ]]; then
            echo "::error::Every master commit must bump the project version; both commits use '${version}'."
            exit 1
          fi
          if [[ "${cargo_version}" != "${version}" || "${lock_version}" != "${version}" ]]; then
            echo "::error::Version mismatch: package.json=${version}, Cargo.toml=${cargo_version}, Cargo.lock=${lock_version}."
            exit 1
          fi

          git fetch --force --tags
          tag_name="v${version}"
          existing_tag_sha="$(git rev-list -n 1 "${tag_name}" 2>/dev/null || true)"

          if [[ -n "${existing_tag_sha}" && "${existing_tag_sha}" != "${target_sha}" ]]; then
            echo "::error::Tag '${tag_name}' already points to ${existing_tag_sha}; bump the project version."
            exit 1
          fi

          if [[ -z "${existing_tag_sha}" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "${tag_name}" "${target_sha}" --message "Release ${tag_name}"
            git push origin "refs/tags/${tag_name}"
          fi

          prerelease=false
          if [[ "${version}" == *-* ]]; then
            prerelease=true
          fi

          if gh release view "${tag_name}" >/dev/null 2>&1; then
            is_draft="$(gh release view "${tag_name}" --json isDraft --jq .isDraft)"
            if [[ "${is_draft}" != "true" ]]; then
              echo "::error::Release '${tag_name}' is already published. Bump the project version for a new commit."
              exit 1
            fi
          else
            release_args=(
              "${tag_name}"
              --draft
              --generate-notes
              --target "${target_sha}"
              --title "${tag_name}"
              --verify-tag
            )
            if [[ "${prerelease}" == "true" ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "${release_args[@]}"
          fi

          release_id="$(gh release view "${tag_name}" --json databaseId --jq .databaseId)"
          {
            echo "prerelease=${prerelease}"
            echo "release_id=${release_id}"
            echo "tag_name=${tag_name}"
            echo "version=${version}"
          } >> "${GITHUB_OUTPUT}"

  build-desktop:
    name: Build ${{ matrix.label }}
    needs: release-metadata
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
          - label: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - label: Windows ARM64
            os: windows-latest
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-metadata.outputs.tag_name }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Tauri icons
        run: pnpm build:icon
        env:
          PLATFORM: ${{ matrix.os }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build and upload desktop app
        uses: tauri-apps/tauri-action@v1
        env:
          CI: false
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          PLATFORM: ${{ matrix.os }}
        with:
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json
          prerelease: ${{ needs.release-metadata.outputs.prerelease }}
          releaseDraft: true
          releaseId: ${{ needs.release-metadata.outputs.release_id }}
          retryAttempts: 3
          tagName: ${{ needs.release-metadata.outputs.tag_name }}
          uploadUpdaterJson: false

  build-android:
    name: Build Android universal APK
    needs: release-metadata
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-metadata.outputs.tag_name }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          link-to-sdk: true
          ndk-version: r29

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build and upload Android app
        uses: tauri-apps/tauri-action@v1
        env:
          CI: false
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        with:
          args: --apk --config src-tauri/tauri.release.conf.json
          mobile: android
          prerelease: ${{ needs.release-metadata.outputs.prerelease }}
          releaseDraft: true
          releaseId: ${{ needs.release-metadata.outputs.release_id }}
          retryAttempts: 3
          tagName: ${{ needs.release-metadata.outputs.tag_name }}

  publish-release:
    name: Publish Release
    needs:
      - release-metadata
      - build-desktop
      - build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish completed release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          PRERELEASE: ${{ needs.release-metadata.outputs.prerelease }}
          TAG_NAME: ${{ needs.release-metadata.outputs.tag_name }}
        run: |
          set -euo pipefail

          args=("${TAG_NAME}" --draft=false)
          if [[ "${PRERELEASE}" == "true" ]]; then
            args+=(--prerelease)
          else
            args+=(--prerelease=false)
          fi
          gh release edit "${args[@]}"
