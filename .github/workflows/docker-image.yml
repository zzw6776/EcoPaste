name: Docker Image CI

"on":
  push:
    branches:
      - master
    paths:
      - sync-server/Cargo.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and Push Sync Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate sync server version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          read_version() {
            sed -n '/^\[package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' | head -n 1
          }

          version="$(read_version < sync-server/Cargo.toml)"
          lock_version="$(awk '
            /^name = "ecopaste-sync-server"$/ { package_found = 1; next }
            package_found && /^version = "/ {
              value = $0
              sub(/^version = "/, "", value)
              sub(/"$/, "", value)
              print value
              exit
            }
          ' sync-server/Cargo.lock)"

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::sync-server/Cargo.toml version must be valid semver, got '${version}'."
            exit 1
          fi
          if [[ "${lock_version}" != "${version}" ]]; then
            echo "::error::Sync server version mismatch: Cargo.toml=${version}, Cargo.lock=${lock_version}."
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            previous_version="$(git show "${GITHUB_SHA}^:sync-server/Cargo.toml" | read_version)"
            if [[ "${previous_version}" == "${version}" ]]; then
              echo "::error::sync-server/Cargo.toml changed without bumping the sync server version."
              exit 1
            fi
          fi

          prerelease=false
          if [[ "${version}" == *-* ]]; then
            prerelease=true
          fi

          {
            echo "version=${version}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"

      - name: Validate Docker Hub credentials
        shell: bash
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "${DOCKERHUB_TOKEN}" ]]; then
            echo "::error::Repository secret DOCKERHUB_TOKEN is not configured."
            exit 1
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare Docker metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: zzw6776/ecopaste-sync-server
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ steps.version.outputs.prerelease == 'false' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: sync-server
          file: sync-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=sync-server
          cache-to: type=gha,mode=max,scope=sync-server
