services:
  ecopaste-sync:
    build: .
    image: ecopaste-sync-server:local
    restart: unless-stopped
    ports:
      - "4443:4443/udp"
    environment:
      ECOPASTE_DATA_DIR: /data
      ECOPASTE_BIND: 0.0.0.0:4443
      ECOPASTE_MAX_BLOB_BYTES: 2147483648
      RUST_LOG: info
    tmpfs:
      - /data
