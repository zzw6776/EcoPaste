services:
  ecopaste-sync:
    image: ghcr.io/zzw6776/ecopaste-sync-server:${ECOPASTE_SYNC_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "4443:4443/udp"
    environment:
      ECOPASTE_DATA_DIR: /data
      ECOPASTE_BIND: 0.0.0.0:4443
      ECOPASTE_MAX_GROUP_BYTES: ${ECOPASTE_MAX_GROUP_BYTES:-10737418240}
      ECOPASTE_GROUP_QUOTA_TRIGGER_PERCENT: ${ECOPASTE_GROUP_QUOTA_TRIGGER_PERCENT:-90}
      ECOPASTE_GROUP_QUOTA_TARGET_PERCENT: ${ECOPASTE_GROUP_QUOTA_TARGET_PERCENT:-70}
      ECOPASTE_EVENT_RETENTION_DAYS: ${ECOPASTE_EVENT_RETENTION_DAYS:-0}
      ECOPASTE_MAX_EVENTS_PER_GROUP: ${ECOPASTE_MAX_EVENTS_PER_GROUP:-0}
      ECOPASTE_NO_RELAY: ${ECOPASTE_NO_RELAY:-true}
      RUST_LOG: info
    volumes:
      - ecopaste-sync-data:/data

volumes:
  ecopaste-sync-data:
    external: true
    name: ecopaste-sync-data
