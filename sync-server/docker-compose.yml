services:
  ecopaste-sync:
    build: .
    image: ecopaste-sync-server:local
    network_mode: host
    restart: unless-stopped
    environment:
      ECOPASTE_DATA_DIR: /data
      ECOPASTE_BIND: 0.0.0.0:4443
      ECOPASTE_MAX_BLOB_BYTES: 2147483648
      RUST_LOG: info
    volumes:
      - ecopaste-sync-data:/data

volumes:
  ecopaste-sync-data:
