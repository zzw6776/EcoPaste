services:
  ecopaste-sync:
    build: .
    image: ecopaste-sync-server:local
    restart: unless-stopped
    environment:
      ECOPASTE_DATA_DIR: /data
      ECOPASTE_BIND: 0.0.0.0:44820
      ECOPASTE_MAX_BLOB_BYTES: 2147483648
      RUST_LOG: info
    ports:
      - "44820:44820/udp"
    volumes:
      - ecopaste-sync-data:/data

volumes:
  ecopaste-sync-data:
