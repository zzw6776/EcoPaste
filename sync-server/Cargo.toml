[workspace]
members = ["protocol"]
resolver = "3"

[package]
name = "ecopaste-sync-server"
version = "0.1.1"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
data-encoding = "2"
ecopaste-sync-protocol = { path = "protocol" }
iroh = { version = "1", default-features = false, features = ["portmapper", "tls-ring"] }
n0-error = "0.1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
subtle = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 1
incremental = true

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 0
incremental = false
