[package]
name = "EcoPaste"
version = "1.1.80"
description = "A local-first clipboard manager for macOS, Windows, and Android."
authors = ["ayangweb"]
license = "Apache-2.0"
homepage = "https://github.com/EcoPasteHub/EcoPaste"
repository = "https://github.com/EcoPasteHub/EcoPaste"
readme = "../README.md"
publish = false
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "eco_paste_lib"
# macOS and Windows consume the rlib while Android loads the cdylib.
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset", "tray-icon", "image-ico"] }
tauri-utils = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tauri-plugin-log = "2"
log = "0.4"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "chrono", "migrate"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
blake3 = "1"
uuid = { version = "1", features = ["v4"] }
regex = "1"
tokio = { version = "1", features = ["fs", "io-util", "net", "sync", "time"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-prevent-default = "5"
image = { version = "0.25", default-features = false, features = ["png"] }
tauri-plugin-os = "2"
time = "0.3"
zip = { version = "4.6", default-features = false, features = ["deflate"] }
walkdir = "2"
tempfile = "3"
argon2 = { version = "0.5", features = ["std"] }
chacha20poly1305 = { version = "0.10", features = ["std", "stream"] }
rand = "0.8"
zeroize = "1"
url = "2"
data-encoding = "2"
ecopaste-sync-protocol = { path = "../sync-server/protocol" }
iroh = { version = "1", default-features = false, features = ["portmapper", "tls-ring"] }
iroh-mdns-address-lookup = "0.5"
minicbor = { version = "2", features = ["derive", "std"] }
n0-future = "0.3"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[target.'cfg(not(target_os = "android"))'.dependencies]
rodio = { version = "0.20", default-features = false, features = ["symphonia-mp3"] }
clipboard-rs = "0.3"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
auto-launch = "0.6"
file_icon_provider = "1"
drag = "2.1"
window-vibrancy = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSData", "NSDictionary", "NSURL", "NSArray", "NSGeometry", "NSAttributedString", "NSProcessInfo", "NSHost"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication", "NSImage", "NSView", "NSWindow", "NSEvent", "NSApplication", "NSResponder", "NSPasteboard", "NSPasteboardItem", "NSDraggingItem", "NSDraggingSession", "NSAttributedString", "NSStringDrawing", "NSColor", "NSFont", "NSParagraphStyle", "NSBezierPath", "NSGraphics", "NSVisualEffectView", "NSGlassEffectView"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebView", "objc2-app-kit"] }
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
plist = { version = "1", default-features = false }
tauri-plugin-macos-permissions = "2"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = [
    "winuser",
    "processthreadsapi",
    "handleapi",
    "winbase",
    "winnt",
    "minwindef",
    "windef",
] }
windows-registry = "0.6"
windows-result = "0.4"
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

# Remove the local overrides when the corresponding upstream fixes are released.
[patch.crates-io]
iroh-mdns-address-lookup = { path = "vendor/iroh-mdns-address-lookup" }
swarm-discovery = { path = "vendor/swarm-discovery" }

# Keep enough symbols for normal debugging without retaining full debug metadata.
[profile.dev]
debug = 1
incremental = true

# Dependencies do not need line tables; matching the test profile also avoids duplicate artifacts.
[profile.dev.package."*"]
debug = 0

# Tests favor small, reproducible artifacts over incremental rebuild speed.
[profile.test]
debug = 0
incremental = false
